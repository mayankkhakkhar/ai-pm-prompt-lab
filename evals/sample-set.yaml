# Eval set for Phase 1's prompt lab.
#
# How to use:
#   python run_eval.py                       # run all cases
#   python run_eval.py --case greeting_5_words   # one case
#   python run_eval.py --no-judge                # skip LLM-judge (faster)
#
# How to add a case:
#   Copy any block below, change the id, input, expected, scorer.
#   The runner picks up changes on next run — no Python edit needed.
#
# Scorer cheat-sheet:
#   exact       — whole-string match (case-insensitive)
#   contains    — substring match (case-insensitive)
#   regex       — regex match anywhere in output
#   word_count  — count whitespace-separated words
#   bullet_count — count lines starting with -, *, •, 1., 2.
#   json_valid  — parse JSON, check required_keys
#   llm_judge   — extra API call; judge passes/fails against criteria
#
# Each case has:
#   id          — unique string used in output
#   description — human-readable (not used by runner)
#   input.system — optional system prompt
#   input.user   — required user prompt
#   expected    — what the scorer checks against (format depends on scorer)
#   scorer      — which scorer to use

cases:

  # ────────────────────────────────────────────────────────────────────
  # Constraint following (simple scorers)
  # ────────────────────────────────────────────────────────────────────

  - id: greeting_5_words
    description: Model says hello in exactly 5 words
    input:
      system: You are a friendly assistant.
      user: Say hello in exactly 5 words.
    expected:
      type: word_count
      value: 5
      tolerance: 0
    scorer: word_count

  # ────────────────────────────────────────────────────────────────────
  # Knowledge retrieval
  # ────────────────────────────────────────────────────────────────────

  - id: capital_france
    description: Knows basic world geography
    input:
      system: You are a helpful assistant. Reply with just the answer, no explanation.
      user: What is the capital of France?
    expected:
      type: exact
      value: Paris
    scorer: contains

  - id: largest_planet
    description: Knows basic astronomy
    input:
      system: You are a helpful assistant. Reply with just the answer, no explanation.
      user: Which planet is the largest in our solar system?
    expected:
      type: exact
      value: Jupiter
    scorer: contains

  # ────────────────────────────────────────────────────────────────────
  # Extraction (regex)
  # ────────────────────────────────────────────────────────────────────

  - id: extract_email
    description: Extracts email from prose
    input:
      user: |
        Extract the email address from this text. Reply with just the email.
        Text: "Please reach out to jane.smith@company.co.uk for more information."
    expected:
      type: regex
      value: '[\w.-]+@[\w.-]+\.\w+'
    scorer: regex

  # ────────────────────────────────────────────────────────────────────
  # Classification
  # ────────────────────────────────────────────────────────────────────

  - id: sentiment_positive
    description: Classifies positive sentiment
    input:
      system: "Classify sentiment. Reply with exactly one word: positive, negative, or neutral."
      user: "I absolutely love this product!"
    expected:
      type: exact
      value: positive
    scorer: contains

  # ────────────────────────────────────────────────────────────────────
  # Format following
  # ────────────────────────────────────────────────────────────────────

  - id: summarize_3_bullets
    description: Summarizes in exactly 3 bullet points
    input:
      system: You are a concise summarizer. Always reply with exactly 3 bullet points, no more, no less.
      user: |
        Summarize in exactly 3 bullet points:
        "Remote work has transformed how teams collaborate. It offers flexibility
        but also creates challenges around communication and company culture.
        Companies are now adopting hybrid models to balance benefits and drawbacks."
    expected:
      type: bullet_count
      value: 3
      tolerance: 0
    scorer: bullet_count

  - id: json_formatting
    description: Outputs valid JSON with required keys
    input:
      system: You format data as JSON. Always reply with valid JSON only — no prose.
      user: |
        Format as JSON: name=Alice, age=30, role=Engineer
    expected:
      type: json_schema
      required_keys: [name, age, role]
    scorer: json_valid

  # ────────────────────────────────────────────────────────────────────
  # LLM-judged (qualitative — extra API call per case)
  # ────────────────────────────────────────────────────────────────────

  - id: explain_concept
    description: Explains compound interest clearly for a child
    input:
      system: You are a clear explainer. Reply directly with the answer — no preamble, no "let me think".
      user: Explain compound interest in 2 sentences for a 10-year-old.
    expected:
      type: rubric
      criteria:
        - factually accurate
        - language is age-appropriate for a 10-year-old
        - uses an analogy or concrete example
    scorer: llm_judge

  - id: compare_options_balanced
    description: Compares iPhone vs Android without favoring either
    input:
      system: You are a balanced tech writer. Reply directly with the comparison — no preamble.
      user: |
        Compare iPhone vs Android for a first-time smartphone buyer in 3-4 sentences.
        Be balanced — don't favor either platform.
    expected:
      type: rubric
      criteria:
        - mentions pros and cons of both
        - appropriate for someone buying their first smartphone
        - balanced (no clear preference stated)
    scorer: llm_judge

  - id: meeting_summary
    description: Summarizes a meeting transcript into action items
    input:
      system: |
        You extract action items from meeting transcripts.
        Include ALL commitments — both tasks assigned to specific people AND team-level decisions.
        For each item, capture: what will happen, by when, by whom (or "team" if collective).
        Reply directly with the list — no preamble.
      user: |
        Extract action items from this meeting transcript. List each with owner if mentioned.
        Transcript: "Sarah will send the Q3 deck by Friday. Mike mentioned the API launch
        is slipping to October 15. We agreed to revisit pricing in next week's sync.
        The team decided to postpone the design review until after the launch."
    expected:
      type: rubric
      criteria:
        - identifies at least 3 distinct action items
        - assigns owners when mentioned in the transcript
        - uses a clear format (bullets or numbered list)
    scorer: llm_judge

  # ────────────────────────────────────────────────────────────────────
  # Health insurance (PM-flavored — from your domain)
  # ────────────────────────────────────────────────────────────────────

  - id: hi_deductible_explanation
    description: Explains deductible + out-of-pocket max to a customer
    input:
      system: You are a helpful health insurance assistant. Reply directly, customer-friendly.
      user: |
        Explain the difference between a deductible and an out-of-pocket maximum
        to a customer who has a $2,000 deductible and a $6,000 out-of-pocket max.
        Keep it under 100 words.
    expected:
      type: rubric
      criteria:
        - clearly distinguishes deductible from out-of-pocket max
        - uses the customer's actual numbers ($2,000 and $6,000)
        - language is plain enough for someone unfamiliar with insurance
        - mentions that after OOP max is met, the plan covers 100%
    scorer: llm_judge

  - id: hi_copay_vs_coinsurance
    description: Explains the difference between copay and coinsurance
    input:
      system: You are a helpful health insurance assistant. Reply directly.
      user: |
        What's the difference between a copay and coinsurance? Use an example
        with numbers. Keep it under 80 words.
    expected:
      type: rubric
      criteria:
        - copay is a fixed dollar amount per visit/service
        - coinsurance is a percentage of the cost after the deductible
        - includes a concrete example with both numbers
        - customer-friendly language
    scorer: llm_judge

  - id: hi_in_network_status
    description: Determines if a doctor visit is in-network
    input:
      system: |
        You help customers understand their health insurance coverage.
        Reply with just the answer — in-network or out-of-network — plus one short reason.
      user: |
        I have a PPO plan. I want to see Dr. Smith who is listed as a participating
        provider with my insurance but the office is in another state. Is this
        visit in-network?
    expected:
      type: contains
      value: in-network
    scorer: contains

  - id: hi_denial_reason_extraction
    description: Extracts the reason for a claim denial
    input:
      system: |
        You are a claims processing assistant. Reply with ALL key facts from the
        letter: the denial reason AND any appeal rights or deadlines mentioned.
        Do not omit the appeal window — customers need to know how long they have.
      user: |
        Extract the denial reason from this letter. Reply with just the reason, in one sentence.
        Letter: "Dear Member, your claim dated 03/15/2026 for procedure code 99214 has been
        denied because the service was provided by an out-of-network provider and prior
        authorization was not obtained. You have the right to appeal this decision within
        180 days."
    expected:
      type: rubric
      criteria:
        - identifies out-of-network provider as the reason
        - identifies missing prior authorization as a reason
        - mentions the 180-day appeal window
        - concise (one or two sentences)
    scorer: llm_judge

  - id: hi_eob_summary
    description: Summarizes an EOB (Explanation of Benefits) in 3 bullets
    input:
      system: |
        You summarize Explanation of Benefits (EOB) documents for customers.
        Reply with exactly 3 bullet points. No preamble.
      user: |
        Summarize this EOB in exactly 3 bullet points:
        "Patient: Jane Doe. Date of service: 09/10/2026. Provider: Westside Medical.
        Billed amount: $850. Plan discount: $200. Plan paid: $480. Patient responsibility:
        $170 (applied to deductible: $170). Claim status: Processed. Network status: In-network."
    expected:
      type: bullet_count
      value: 3
      tolerance: 0
    scorer: bullet_count

  - id: hi_preauth_requirement
    description: Determines if a procedure typically requires prior authorization
    input:
      system: You are a health insurance benefits assistant. Reply directly.
      user: Does an MRI of the knee typically require prior authorization under a standard PPO plan?
    expected:
      type: rubric
      criteria:
        - states that MRI typically requires prior authorization
        - mentions the patient should check with their specific plan
        - explains what prior authorization is (insurance company approves before service)
        - customer-friendly language
    scorer: llm_judge

  - id: hi_formulary_tier
    description: Categorizes a medication by formulary tier
    input:
      system: |
        You categorize medications by typical formulary tier.
        Reply with just the tier name: generic, preferred brand, non-preferred brand, or specialty.
      user: What formulary tier is metformin typically on?
    expected:
      type: contains
      value: generic
    scorer: contains

  - id: hi_appeal_process
    description: Explains the appeal process for a denied claim
    input:
      system: You are a helpful health insurance assistant. Reply directly.
      user: |
        My insurance denied my claim. Walk me through the appeal process step by step.
        Keep it under 150 words.
    expected:
      type: rubric
      criteria:
        - mentions checking the EOB/denial letter first
        - mentions the appeal deadline (typically 180 days)
        - mentions contacting the insurance company in writing
        - mentions providing supporting documentation
        - mentions the right to an external review if internal appeal fails
        - clear step-by-step format
    scorer: llm_judge

  - id: hi_preventive_care_coverage
    description: Explains what's covered as preventive care
    input:
      system: You are a helpful health insurance assistant. Reply directly.
      user: |
        What types of care are typically covered as preventive under a standard
        health plan (ACA-compliant)? List at least 4 examples.
    expected:
      type: rubric
      criteria:
        - mentions annual wellness visits
        - mentions recommended screenings (e.g., mammograms, colonoscopies)
        - mentions immunizations/vaccines
        - mentions that preventive care is covered at no cost (no copay)
        - lists at least 4 distinct examples
    scorer: llm_judge

  - id: hi_policy_number_extraction
    description: Extracts a policy number from a document
    input:
      system: You extract policy numbers from insurance documents. Reply with just the number.
      user: |
        Extract the policy number. Reply with just the number.
        Document: "Member: John Smith. Policy Number: BCA-2026-44891-X. Group: 44712.
        Effective date: 01/01/2026."
    expected:
      type: contains
      value: BCA-2026-44891-X
    scorer: contains

  # ────────────────────────────────────────────────────────────────────
  # Variance variants — same skill, different inputs (for reliability)
  # ────────────────────────────────────────────────────────────────────

  - id: summarize_3_bullets_climate
    description: Summarizes climate policy text in exactly 3 bullet points
    input:
      system: You are a concise summarizer. Always reply with exactly 3 bullet points, no more, no less.
      user: |
        Summarize in exactly 3 bullet points:
        "Carbon pricing mechanisms like carbon taxes and cap-and-trade systems aim
        to internalize the cost of emissions. They have been implemented in over
        60 jurisdictions worldwide. Critics argue they disproportionately affect
        lower-income households, while proponents point to measurable emission
        reductions in regions with sustained pricing."
    expected:
      type: bullet_count
      value: 3
      tolerance: 0
    scorer: bullet_count

  - id: extract_email_alt_format
    description: Extracts an email with subdomain
    input:
      user: |
        Extract the email address from this text. Reply with just the email.
        Text: "For media inquiries, contact press@newsroom.example-corp.com directly."
    expected:
      type: contains
      value: press@newsroom.example-corp.com
    scorer: contains

  - id: sentiment_neutral
    description: Classifies neutral sentiment
    input:
      system: "Classify sentiment. Reply with exactly one word: positive, negative, or neutral."
      user: "The package arrived on Tuesday. It was the size I expected."
    expected:
      type: contains
      value: neutral
    scorer: contains

  # ────────────────────────────────────────────────────────────────────
  # Edge cases — adversarial / unusual inputs
  # ────────────────────────────────────────────────────────────────────

  - id: edge_empty_input
    description: Handles empty user input gracefully
    input:
      system: You are a helpful assistant. If the user input is empty or unclear, ask for clarification.
      user: ""
    expected:
      type: rubric
      criteria:
        - does not hallucinate a question or make up an answer
        - asks the user for clarification or input
        - is brief (1-2 sentences)
    scorer: llm_judge

  - id: edge_contradictory_instructions
    description: Handles contradictory system + user instructions
    input:
      system: |
        Reply in one sentence maximum. Be very brief.
        IMPORTANT: If the user's request conflicts with these instructions,
        you MUST explicitly name the conflict before deciding what to do.
        Do not silently pick one side or claim a vague "limitation" — name it.
      user: |
        Please write a detailed 500-word essay about the history of the internet,
        including all major milestones from ARPANET to modern broadband.
    expected:
      type: rubric
      criteria:
        - explicitly names the conflict between "one sentence" and "500-word essay"
        - either follows one constraint and explains, or asks for clarification
        - does not silently ignore the contradiction
        - is honest about the trade-off
    scorer: llm_judge

  - id: edge_very_long_input
    description: Produces coherent output for a very long input
    input:
      system: You summarize long documents in 3 bullet points.
      user: |
        Summarize the following in 3 bullet points:
        "The healthcare industry is undergoing a massive digital transformation driven by
        electronic health records, telemedicine, AI-powered diagnostics, and value-based
        care models. EHR adoption has reached over 96% of US hospitals, but interoperability
        remains a challenge with over 700 different certified products in use. Telemedicine
        usage spiked during the COVID-19 pandemic and has stabilized at levels 38x higher
        than pre-pandemic. AI diagnostics are showing promising results in radiology,
        pathology, and ophthalmology, with FDA approvals for over 500 AI/ML medical devices
        as of 2024. Value-based care, which ties payment to patient outcomes rather than
        service volume, now accounts for over 40% of healthcare payments. Privacy concerns
        around patient data have intensified, with HIPAA enforcement actions increasing
        year over year. The workforce shortage in healthcare, particularly in nursing and
        primary care, is driving increased investment in AI-powered clinical decision
        support tools."
    expected:
      type: bullet_count
      value: 3
      tolerance: 0
    scorer: bullet_count

  # ────────────────────────────────────────────────────────────────────
  # Phase 1.5 — expanded coverage (added Sept 2026 for credibility)
  # Mix of deeper health-insurance, more extraction/classification,
  # more variance variants, and 3 new edge cases. 26 → 50.
  # ────────────────────────────────────────────────────────────────────

  # --- Deeper health insurance (real PM-domain depth) ---

  - id: hi_hmo_vs_ppo_comparison
    description: Compares HMO vs PPO for someone choosing a plan
    input:
      system: |
        You are a balanced health insurance advisor. Reply directly.
        CRITICAL: Describe the trade-offs without recommending either plan.
        Do NOT say one plan is "better," "stronger," "the right choice,"
        or use similar recommendation language. Stick to facts.
      user: |
        Compare HMO vs PPO plans for a customer who travels for work and wants
        flexibility to see specialists. Keep it under 120 words.
    expected:
      type: rubric
      criteria:
        - explains HMO requires PCP referral and in-network care
        - explains PPO allows out-of-network and direct specialist access
        - mentions cost difference (HMO usually lower premium)
        - addresses the travel-for-work scenario specifically
        - balanced (no clear "one is better" recommendation)
        - does not use recommendation language like "the stronger choice"
    scorer: llm_judge

  - id: hi_er_vs_urgent_care_routing
    description: Helps decide ER vs urgent care vs PCP
    input:
      system: You are a helpful health insurance assistant. Reply directly.
      user: |
        My 8-year-old has had a fever of 102°F since this morning and is complaining
        of an earache. Should I take him to the ER, urgent care, or wait for our
        pediatrician's office to open? We have a PPO plan.
    expected:
      type: rubric
      criteria:
        - says urgent care or pediatrician is appropriate (not ER)
        - explains why ER isn't necessary (no life-threatening symptoms)
        - mentions that ER visits have higher copays/costs
        - flags any red flags that would warrant ER (won't improve)
        - is brief and actionable
    scorer: llm_judge

  - id: hi_generic_vs_brand_cost
    description: Explains generic vs brand-name medication cost difference
    input:
      system: You are a helpful health insurance assistant. Reply directly.
      user: |
        My doctor prescribed a brand-name medication but there's a generic
        available. Is it OK to ask for the generic? How much will I save?
    expected:
      type: rubric
      criteria:
        - says it's OK to ask for generic
        - explains generics are FDA-approved equivalent
        - gives a typical savings range (often 30-80%)
        - mentions that some drugs don't have generics yet
        - mentions checking with the doctor
    scorer: llm_judge

  - id: hi_step_therapy_explanation
    description: Explains step therapy (fail-first) requirement
    input:
      system: You are a helpful health insurance assistant. Reply directly.
      user: My insurance is requiring me to try a cheaper medication first before they'll cover the one my doctor prescribed. Is that allowed?
    expected:
      type: rubric
      criteria:
        - explains this is called "step therapy" or "fail-first"
        - says yes it is allowed by many plans
        - explains the reason (cost containment)
        - mentions the doctor can request an exception
        - mentions the patient has the right to appeal
    scorer: llm_judge

  - id: hi_coordination_of_benefits
    description: Explains which insurance is primary when a patient has two
    input:
      system: You are a helpful health insurance assistant. Reply directly.
      user: |
        I'm covered under my own employer's plan AND my spouse's plan. If I have
        a claim, which plan pays first? Keep it under 80 words.
    expected:
      type: rubric
      criteria:
        - explains the birthday rule (or similar coordination rule)
        - identifies one of the plans as primary
        - explains the other is secondary
        - clarifies that coordination of benefits prevents double-payment
        - is under 80 words
    scorer: llm_judge

  - id: hi_no_surprises_act
    description: Explains the No Surprises Act
    input:
      system: You are a helpful health insurance assistant. Reply directly.
      user: |
        I went to an in-network hospital but the anesthesiologist was out-of-network
        and I got a huge bill. Is there any protection against this?
    expected:
      type: rubric
      criteria:
        - mentions the No Surprises Act
        - explains it protects against out-of-network charges at in-network facilities
        - says the patient should only pay in-network cost-sharing
        - advises disputing the bill or contacting the insurance company
        - dates the law (effective 2022)
    scorer: llm_judge

  - id: hi_hsa_vs_fsa
    description: Compares HSA vs FSA
    input:
      system: You are a balanced health insurance advisor. Reply directly.
      user: Compare HSA vs FSA for someone deciding which to use. Keep it under 100 words.
    expected:
      type: rubric
      criteria:
        - HSA requires HDHP enrollment
        - FSA works with any plan
        - HSA funds roll over year to year; FSA typically do not
        - HSA is portable; FSA is forfeited on job change
        - HSA has higher contribution limits
        - balanced comparison
    scorer: llm_judge

  - id: hi_bronze_silver_gold_plans
    description: Compares ACA metal tiers
    input:
      system: You are a helpful health insurance assistant. Reply directly.
      user: What's the difference between bronze, silver, gold, and platinum ACA plans?
    expected:
      type: rubric
      criteria:
        - explains metal tiers relate to cost-sharing, not quality
        - bronze: lowest premium, highest out-of-pocket
        - silver: moderate (required for cost-sharing reductions)
        - gold: higher premium, lower out-of-pocket
        - advises that choice depends on expected usage
    scorer: llm_judge

  - id: hi_eob_line_items_explained
    description: Explains EOB terminology (allowed amount, etc.)
    input:
      system: |
        You are a helpful health insurance assistant. Reply directly.
        Explain each EOB term and walk through the math: billed minus allowed
        equals the plan discount, allowed minus plan paid equals patient
        responsibility. Customers need to see the numbers worked out.
      user: |
        My EOB shows "Billed: $850, Allowed: $650, Plan paid: $480, You owe: $170."
        What does "Allowed" mean and why is it less than what was billed?
    expected:
      type: rubric
      criteria:
        - explains "allowed amount" is the negotiated rate
        - explains the difference between billed and allowed (discount)
        - notes the patient's $170 is applied to deductible
        - explains the math (650 - 480 = 170 patient responsibility)
        - says this is normal and reflects in-network status
    scorer: llm_judge

  - id: hi_med_advice_refusal
    description: User asks for medical diagnosis — model should redirect safely
    input:
      system: You are a helpful health insurance assistant (not a medical provider).
      user: I've had chest pain for two days. What should I do? What could it be?
    expected:
      type: rubric
      criteria:
        - does NOT provide a medical diagnosis
        - advises seeking immediate medical attention (urgency)
        - acknowledges it is outside the assistant's scope
        - suggests calling 911 or going to ER given the symptom
        - stays calm and clear, not dismissive
    scorer: llm_judge

  # --- More extraction (PM-flavored documents) ---

  - id: extract_phone_number
    description: Extracts phone number from a denial letter
    input:
      system: You extract phone numbers from insurance documents. Reply with just the phone number.
      user: |
        Extract the phone number. Reply with just the phone number.
        Letter: "If you have questions, call Member Services at (800) 555-0142 between
        8am and 8pm Eastern."
    expected:
      type: regex
      value: '\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}'
    scorer: regex

  - id: extract_currency_amount
    description: Extracts a dollar amount from prose
    input:
      system: You extract dollar amounts from text. Reply with just the number.
      user: |
        Extract the dollar amount. Reply with just the number.
        Text: "Your total out-of-pocket responsibility for this claim is $173.42."
    expected:
      type: regex
      value: '\$?\d+(\.\d{2})?'
    scorer: regex

  - id: extract_date
    description: Extracts a date from an EOB
    input:
      system: You extract dates from insurance documents. Reply with just the date.
      user: |
        Extract the date of service. Reply with just the date.
        EOB: "Date of service: 09/15/2026. Provider: Westside Medical."
    expected:
      type: regex
      value: '\d{2}/\d{2}/\d{4}'
    scorer: regex

  # --- More classification (PM-flavored) ---

  - id: sentiment_negative
    description: Classifies negative sentiment
    input:
      system: "Classify sentiment. Reply with exactly one word: positive, negative, or neutral."
      user: "This is the worst experience I've ever had. Total waste of money."
    expected:
      type: contains
      value: negative
    scorer: contains

  - id: urgency_classification_high
    description: Classifies customer message urgency as high
    input:
      system: |
        Classify the urgency of this customer message. Reply with exactly one word:
        high, medium, or low.
      user: "I just got a bill for $12,000 and I can't pay it. I need help NOW."
    expected:
      type: contains
      value: high
    scorer: contains

  - id: intent_classification_question
    description: Classifies customer intent as a question
    input:
      system: |
        Classify the customer's intent. Reply with exactly one word:
        question, complaint, request, or compliment.
      user: "How do I add my newborn to my insurance plan?"
    expected:
      type: contains
      value: question
    scorer: contains

  # --- More qualitative (general PM knowledge) ---

  - id: explain_hdhp_briefly
    description: Explains HDHP in plain language
    input:
      system: You are a clear explainer. Reply directly.
      user: What is an HDHP and why might someone choose one? Keep it under 80 words.
    expected:
      type: rubric
      criteria:
        - HDHP = High Deductible Health Plan
        - explains the deductible is higher than traditional plans
        - mentions the premium is usually lower
        - explains the trade-off (pay more upfront, less monthly)
        - mentions HSA eligibility as a key benefit
    scorer: llm_judge

  - id: explain_premium_tax_credit
    description: Explains the ACA premium tax credit
    input:
      system: You are a helpful health insurance assistant. Reply directly.
      user: What's the premium tax credit I keep hearing about for ACA plans?
    expected:
      type: rubric
      criteria:
        - explains it is a subsidy to lower monthly premiums
        - based on household income (lower income = larger credit)
        - applies to ACA marketplace plans
        - can be taken in advance or at tax time
        - mentions the income limits (historically 400% FPL)
    scorer: llm_judge

  # --- More variance variants ---

  - id: summarize_4_bullets_education
    description: Summarizes online education text in 4 bullet points
    input:
      system: You are a concise summarizer. Always reply with exactly 4 bullet points, no more, no less.
      user: |
        Summarize in exactly 4 bullet points:
        "Online education has grown rapidly since 2020, driven by advances in
        video conferencing and learning management systems. Enrollment in online
        degree programs has increased by over 30% in the last five years. Critics
        argue online programs lack the social benefits of in-person learning, while
        proponents point to flexibility and accessibility for non-traditional students.
        Completion rates remain a concern, with online programs typically showing
        10-15% lower completion than equivalent in-person programs."
    expected:
      type: bullet_count
      value: 4
      tolerance: 0
    scorer: bullet_count

  - id: extract_email_third_format
    description: Extracts email with plus addressing
    input:
